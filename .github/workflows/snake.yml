name: Generate Snake Animation

on:
  # Dijalankan secara otomatis setiap jam 00:00
  schedule:
    - cron: "0 0 * * *" 
  
  # Memungkinkan kamu menjalankan script ini secara manual kapan saja
  workflow_dispatch:
  
  # Dijalankan setiap kali kamu melakukan push ke branch main/master
  push:
    branches:
    - main

jobs:
  generate:
    permissions: 
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
# Langkah 1: Menghasilkan gambar ular menggunakan Platane/snk
      - name: Generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#ffffff&color_dots=#161b22,#444444,#777777,#aaaaaa,#ffffff
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      # Langkah 2: Mengirim gambar yang sudah dibuat ke branch "output"
      - name: Push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
